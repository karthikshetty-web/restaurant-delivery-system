<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kudla Kitchen Delivery Partner Dashboard Overview">
    <title>Rider Dashboard | Kudla Kitchen Delivery</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Delivery CSS -->
    <link rel="stylesheet" href="assets/css/delivery.css">
</head>
<body>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Top Header Bar -->
    <header class="delivery-header">
        <div class="delivery-brand">
            <span>🚴</span>
            <span>Kudla Rider</span>
        </div>

        <div style="display: flex; align-items: center; gap: 0.8rem;">
            <button id="delivery-theme-btn" title="Toggle Dark/Light Mode">☀️</button>
            <div id="delivery-profile-display"></div>
            <button onclick="DeliveryApp.logout()" class="btn btn-secondary" style="padding: 0.35rem 0.6rem; font-size: 0.8rem; color: #dc2626;">
                🚪
            </button>
        </div>
    </header>

    <!-- Main Mobile Content Area -->
    <main class="delivery-container">
        <div id="delivery-dashboard-container">
            <!-- Loaded dynamically by delivery.js -->
        </div>
    </main>

    <!-- Mobile Bottom Tab Navigation -->
    <nav class="delivery-bottom-nav">
        <a href="index.html" class="tab-link active">
            <span class="tab-icon">📊</span>
            <span>Dashboard</span>
        </a>
        <a href="orders.html" class="tab-link">
            <span class="tab-icon">📦</span>
            <span>My Orders</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="assets/js/delivery-api.js"></script>
    <script src="assets/js/delivery.js"></script>
</body>
</html>
