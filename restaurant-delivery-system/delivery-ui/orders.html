<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kudla Kitchen Delivery Partner - Assigned Orders & Delivery Statuses">
    <title>My Delivery Orders | Kudla Kitchen Delivery</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Delivery CSS -->
    <link rel="stylesheet" href="assets/css/delivery.css">
</head>
<body>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Top Header Bar -->
    <header class="delivery-header">
        <div class="delivery-brand">
            <span>📦</span>
            <span>My Deliveries</span>
        </div>

        <div style="display: flex; align-items: center; gap: 0.8rem;">
            <button id="refresh-delivery-orders-btn" class="btn btn-secondary" style="padding: 0.35rem 0.6rem; font-size: 0.8rem;">
                🔄 Refresh
            </button>
            <button id="delivery-theme-btn" title="Toggle Dark/Light Mode">☀️</button>
            <button onclick="DeliveryApp.logout()" class="btn btn-secondary" style="padding: 0.35rem 0.6rem; font-size: 0.8rem; color: #dc2626;">
                🚪
            </button>
        </div>
    </header>

    <!-- Main Mobile Content Area -->
    <main class="delivery-container">
        <!-- Filter Tabs -->
        <div style="display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 1.5rem;">
            <button id="tab-active-orders" class="tab-link active" style="width: 50%; padding: 0.8rem; border-bottom: 3px solid var(--accent-primary); font-size: 0.95rem;">
                🛵 Active Deliveries
            </button>
            <button id="tab-completed-orders" class="tab-link" style="width: 50%; padding: 0.8rem; border-bottom: 3px solid transparent; font-size: 0.95rem;">
                ✅ Completed History
            </button>
        </div>

        <div id="delivery-orders-container">
            <div id="delivery-orders-list">
                <!-- Loaded dynamically by DeliveryOrders -->
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Tab Navigation -->
    <nav class="delivery-bottom-nav">
        <a href="index.html" class="tab-link">
            <span class="tab-icon">📊</span>
            <span>Dashboard</span>
        </a>
        <a href="orders.html" class="tab-link active">
            <span class="tab-icon">📦</span>
            <span>My Orders</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="assets/js/delivery-api.js"></script>
    <script src="assets/js/delivery.js"></script>
    <script src="assets/js/delivery-orders.js"></script>
</body>
</html>
